name: Build KernelSU-Next for POCO X4 Pro 5G (veux/peux)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: 'KernelSU-Next branch'
        required: false
        default: 'next'

jobs:
  build:
    name: Build Kernel + Repack boot.img
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          # Install LLVM/Clang via official LLVM script (always gets latest stable)
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 18 || \
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 17 || \
          sudo apt-get install -y clang lld llvm
          # Install build deps
          sudo apt-get install -y --no-install-recommends \
            git curl wget zip unzip bc bison flex libssl-dev libelf-dev \
            python3 cpio build-essential gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi make libncurses-dev lz4 zstd
          # Create/find unversioned symlinks
          CLANG_VER=$(clang --version 2>/dev/null | grep -oP '\d+\.\d+' | head -1 | cut -d. -f1 || echo "")
          echo "Detected clang version: $CLANG_VER"
          for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
            if ! command -v $tool &>/dev/null; then
              VERSIONED=$(ls /usr/bin/${tool}-* 2>/dev/null | sort -V | tail -1)
              [ -n "$VERSIONED" ] && sudo ln -sf "$VERSIONED" "/usr/local/bin/$tool" && echo "Linked $VERSIONED -> $tool"
            fi
          done
          clang --version | head -1

      - name: Set up Clang toolchain
        run: echo "Clang installed in previous step"

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            https://github.com/PixelExperience-Devices/kernel_xiaomi_sm6375 \
            -b fourteen \
            $HOME/kernel
          head -5 $HOME/kernel/Makefile

      - name: Integrate KernelSU-Next
        run: |
          cd $HOME/kernel
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s next
          echo "KSU-Next integrated"

      - name: Patch defconfig
        run: |
          cd $HOME/kernel
          DEFCONFIG="arch/arm64/configs/veux_defconfig"
          sed -i '/CONFIG_KSU/d' "$DEFCONFIG"
          sed -i '/CONFIG_KPROBES=/d' "$DEFCONFIG"
          printf '\n# KernelSU-Next non-GKI\nCONFIG_KSU=y\nCONFIG_KSU_WITH_KPROBES=n\nCONFIG_KPROBES=n\n' >> "$DEFCONFIG"
          tail -6 "$DEFCONFIG"

      - name: Create KSU patch script
        run: |
          cat > $HOME/kernel/scripts/ksu_patch.py << 'ENDOFSCRIPT'
          import re, sys

          def patch(path, marker, extern, hook, func_re):
              txt = open(path).read()
              if marker in txt:
                  print(f"{path}: already patched"); return
              m = re.search(func_re, txt, re.MULTILINE | re.DOTALL)
              if not m:
                  print(f"ERROR: pattern not found in {path}"); sys.exit(1)
              txt = txt[:m.start()] + extern + txt[m.start():]
              m2 = re.search(func_re, txt, re.MULTILINE | re.DOTALL)
              txt = txt[:m2.end()] + hook + txt[m2.end():]
              open(path, 'w').write(txt)
              print(f"{path}: OK")

          patch("fs/exec.c", "ksu_handle_execveat",
              "#ifdef CONFIG_KSU\nextern bool ksu_execveat_hook __read_mostly;\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\nextern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n#endif\n",
              "\n\t#ifdef CONFIG_KSU\n\tif (unlikely(ksu_execveat_hook)) ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n\telse ksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);\n\t#endif",
              r"static int do_execveat_common\(int fd,.*?\)\s*\n\{")

          txt = open("fs/open.c").read()
          if "ksu_handle_faccessat" not in txt:
              p = r"long do_faccessat\(int dfd,.*?\)\s*\n\{"
              if not re.search(p, txt, re.MULTILINE|re.DOTALL):
                  p = r"SYSCALL_DEFINE3\(faccessat,.*?\)\s*\n\{"
              patch("fs/open.c", "ksu_handle_faccessat",
                  "#ifdef CONFIG_KSU\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif\n",
                  "\n\t#ifdef CONFIG_KSU\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n\t#endif",
                  p)
          else:
              print("fs/open.c: already patched")

          patch("fs/read_write.c", "ksu_handle_vfs_read",
              "#ifdef CONFIG_KSU\nextern bool ksu_vfs_read_hook __read_mostly;\nextern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\n#endif\n",
              "\n\t#ifdef CONFIG_KSU\n\tif (unlikely(ksu_vfs_read_hook)) ksu_handle_vfs_read(&file, &buf, &count, &pos);\n\t#endif",
              r"ssize_t vfs_read\(struct file \*file,.*?\)\s*\n\{")

          txt = open("fs/stat.c").read()
          if "ksu_handle_stat" not in txt:
              p = r"int vfs_statx\(int dfd,.*?\)\s*\n\{"
              if not re.search(p, txt, re.MULTILINE|re.DOTALL):
                  p = r"int vfs_fstatat\(int dfd,.*?\)\s*\n\{"
              patch("fs/stat.c", "ksu_handle_stat",
                  "#ifdef CONFIG_KSU\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n#endif\n",
                  "\n\t#ifdef CONFIG_KSU\n\tksu_handle_stat(&dfd, &filename, &flags);\n\t#endif",
                  p)
          else:
              print("fs/stat.c: already patched")

          patch("drivers/input/input.c", "ksu_handle_input_handle_event",
              "#ifdef CONFIG_KSU\nextern bool ksu_input_hook __read_mostly;\nextern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n#endif\n",
              "\n\t#ifdef CONFIG_KSU\n\tif (unlikely(ksu_input_hook)) ksu_handle_input_handle_event(&type, &code, &value);\n\t#endif",
              r"static void input_handle_event\(struct input_dev \*dev,.*?\)\s*\n\{")

          txt = open("fs/devpts/inode.c").read()
          if "ksu_handle_devpts" not in txt:
              p = r"void \*devpts_get_priv\(struct dentry \*dentry\)\s*\n\{"
              if re.search(p, txt, re.MULTILINE):
                  patch("fs/devpts/inode.c", "ksu_handle_devpts",
                      "#ifdef CONFIG_KSU\nextern int ksu_handle_devpts(struct inode*);\n#endif\n",
                      "\n\t#ifdef CONFIG_KSU\n\tksu_handle_devpts(dentry->d_inode);\n\t#endif",
                      p)
              else:
                  print("fs/devpts/inode.c: pattern not found, skipping")
          else:
              print("fs/devpts/inode.c: already patched")

          print("All hooks applied!")
          ENDOFSCRIPT

      - name: Apply manual KSU hooks
        run: |
          cd $HOME/kernel
          python3 scripts/ksu_patch.py

      - name: Verify patches
        run: |
          cd $HOME/kernel
          for entry in "fs/exec.c ksu_handle_execveat" "fs/open.c ksu_handle_faccessat" "fs/read_write.c ksu_handle_vfs_read" "fs/stat.c ksu_handle_stat" "drivers/input/input.c ksu_handle_input_handle_event"; do
            FILE=$(echo $entry | cut -d' ' -f1)
            SYM=$(echo $entry | cut -d' ' -f2)
            COUNT=$(grep -c "$SYM" "$FILE" 2>/dev/null || echo 0)
            if [ "$COUNT" -gt 0 ]; then
              echo "OK $FILE ($COUNT refs to $SYM)"
            else
              echo "MISSING $FILE has no $SYM" && exit 1
            fi
          done
          grep -E "CONFIG_KSU|CONFIG_KPROBES" arch/arm64/configs/veux_defconfig

      - name: Build kernel
        run: |
          cd $HOME/kernel
          export PATH="$HOME/toolchains/clang/bin:$PATH"
          MAKE_ARGS="-j$(nproc) O=out ARCH=arm64 SUBARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip"
          make $MAKE_ARGS veux_defconfig
          make $MAKE_ARGS Image.gz 2>&1 | tee /tmp/build.log | tail -30
          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "BUILD SUCCESS"
            ls -lh out/arch/arm64/boot/Image.gz
          else
            echo "BUILD FAILED - last 100 lines:"
            tail -100 /tmp/build.log
            exit 1
          fi

      - name: Get magiskboot
        run: |
          wget -q "https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk" -O /tmp/Magisk.apk
          unzip -qj /tmp/Magisk.apk 'lib/x86_64/libmagiskboot.so' -d /tmp
          mv /tmp/libmagiskboot.so /tmp/magiskboot
          chmod +x /tmp/magiskboot

      - name: Download stock boot.img
        run: |
          mkdir -p /tmp/bootimg && cd /tmp/bootimg
          echo "Downloading stock_boot.img from GitHub release..."
          wget -q --show-progress --progress=dot:mega \
            "https://github.com/djgamingvip/Rooted-Device-Panel/releases/download/boot-img-v1/stock_boot.img" \
            -O boot.img
          ls -lh boot.img
          xxd boot.img | head -1

      - name: Repack boot.img
        run: |
          cd /tmp/bootimg
          /tmp/magiskboot unpack boot.img
          cp $HOME/kernel/out/arch/arm64/boot/Image.gz kernel
          /tmp/magiskboot repack boot.img KSU-Next_boot_veux_OS1.0.9.0.TKCINXM.img
          ls -lh KSU-Next_boot_veux_OS1.0.9.0.TKCINXM.img
          cp KSU-Next_boot_veux_OS1.0.9.0.TKCINXM.img $GITHUB_WORKSPACE/

      - name: Upload boot.img artifact
        uses: actions/upload-artifact@v4
        with:
          name: KSU-Next-boot-veux-OS1.0.9.0.TKCINXM
          path: KSU-Next_boot_veux_OS1.0.9.0.TKCINXM.img
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore
          retention-days: 7
